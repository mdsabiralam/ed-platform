name: ui_kit
description: "A reusable UI kit for the education platform."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  timelines: ^0.1.0
  image_cropper: ^5.0.0
  signature: ^5.4.0
  chewie: ^1.7.0
  video_player: ^2.8.0
  flutter_windowmanager: ^0.2.0
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
