name: Hotfix (Shorebird)

on:
  push:
    branches:
      - 'hotfix/*'

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.4'
          channel: 'stable'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v0
        with:
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > apps/mobile/android/app/upload-keystore.jks

      - name: Create Patch
        working-directory: apps/mobile
        env:
          KEYSTORE_PATH: upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: shorebird patch android --flavor prod -t lib/main_prod.dart

      - name: Clean up Keystore
        if: always()
        run: rm apps/mobile/android/app/upload-keystore.jks
