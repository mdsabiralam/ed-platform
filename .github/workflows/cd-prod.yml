name: CD Prod

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }}

      # Database Migration
      - name: Run Database Migrations
        run: |
          kubectl run migration --image=${{ secrets.ECR_REGISTRY }}/backend:${{ github.sha }} --restart=Never --rm -i --command -- npx prisma migrate deploy

      # Deploy
      - name: Deploy to EKS
        run: |
          kubectl set image deployment/backend backend=${{ secrets.ECR_REGISTRY }}/backend:${{ github.sha }}

      # Verify Rollout
      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/backend

      # Rollback Check
      - name: Health Check & Rollback
        if: success() || failure()
        run: |
          # Execute the rollback script
          chmod +x apps/backend/scripts/rollback.sh
          ./apps/backend/scripts/rollback.sh

      # Notification
      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: 'Prod Deployment Status: ${{ job.status }} - Version: ${{ github.event.release.tag_name }} (Commit: ${{ github.sha }})'
          SLACK_TITLE: Prod Deployment
