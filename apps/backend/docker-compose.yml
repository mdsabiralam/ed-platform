services:
  postgres:
    build:
      context: ./database
    container_name: ed_postgres_db
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-ed_platform}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: ed_pgbouncer
    restart: always
    ports:
      - "6432:6432"
    environment:
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_HOST: postgres
      DB_PORT: 5432
      POOL_MODE: transaction
      ADMIN_USERS: ${DB_USER:-admin}
    depends_on:
      - postgres

  pgadmin:
    image: dpage/pgadmin4
    container_name: ed_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:alpine
    container_name: ed_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backups:
    image: prodrigestivill/postgres-backup-local
    container_name: ed_pgbackups
    restart: always
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-ed_platform}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
    depends_on:
      - postgres

volumes:
  postgres_data:
