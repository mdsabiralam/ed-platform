<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f0f0" />

  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="50" fill="#FFD700" opacity="0.5" />
  <circle cx="700" cy="500" r="80" fill="#FF4500" opacity="0.5" />

  <!-- Text Placeholders -->
  <text x="400" y="100" font-family="Arial" font-size="40" text-anchor="middle" fill="#333333">Happy Diwali!</text>
  <text x="400" y="200" font-family="Arial" font-size="30" text-anchor="middle" fill="#666666">{{School_Name}}</text>

  <!-- Greeting -->
  <text x="400" y="300" font-family="Arial" font-size="24" text-anchor="middle" fill="#888888">Wishing you a prosperous year ahead.</text>

  <!-- Space for Logo (visual marker, will be overlaid programmatically or replaced) -->
  <rect id="logo_placeholder" x="350" y="400" width="100" height="100" fill="none" stroke="#ccc" stroke-dasharray="5,5" />
  <text x="400" y="450" font-family="Arial" font-size="12" text-anchor="middle" fill="#aaa">Logo Area</text>
</svg>
