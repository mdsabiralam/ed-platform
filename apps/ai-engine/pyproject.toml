[tool.poetry]
name = "ai-engine"
version = "0.1.0"
description = "AI Microservice for Computer Vision and ML tasks"
authors = ["Admin <admin@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
opencv-python-headless = "^4.9.0"
numpy = "^1.26.0"
torch = "2.2.0"
torchvision = "0.17.0"
celery = "^5.3.0"
redis = "^5.0.0"
pyjwt = "^2.8.0"
python-multipart = "^0.0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
