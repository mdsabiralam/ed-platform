version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ed_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ed_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: ed_redis
    ports:
      - "6379:6379"

  ai-engine:
    build:
      context: ./apps/ai_engine
      dockerfile: Dockerfile
    container_name: ed_ai_engine
    restart: always
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres:5432/ed_platform
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    # 8. Scaling Strategy (Docker) - GPU Resource Reservation
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pg_data:
