version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ed_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ed_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: ed_redis
    ports:
      - "6379:6379"

volumes:
  pg_data: