version: '3.8'
services:
  # PostgreSQL Database (Task 1.C.01)
  postgres:
    image: postgres:14-alpine
    container_name: ed_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ed_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Redis for Caching (Task 1.G.04)
  redis:
    image: redis:alpine
    container_name: ed_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data: